BD.EXCEPT.NP.visibilityThresholdEnabled=true

#### Optimization [BD.OPT] ####
BD.OPT.INEFCOL=false
BD.OPT.INEFMAP=false
BD.OPT.INEFMAPRM=false

#### Possible Bugs [BD.PB] ####
